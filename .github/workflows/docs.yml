name: Docs site

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - docs/requirements.txt
      - mkdocs.yml
      - scripts/build_index.py
      - scripts/check_mermaid.py
      - scripts/rewrite_doc_links.py
      - README.md
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - docs/requirements.txt
      - mkdocs.yml
      - scripts/build_index.py
      - scripts/check_mermaid.py
      - scripts/rewrite_doc_links.py
      - README.md
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt

      - name: Generate landing page from README
        run: python3 scripts/build_index.py

      - name: Check docs links point inside docs/ or at GitHub
        run: python3 scripts/rewrite_doc_links.py --check

      # Mermaid parse errors are invisible to mkdocs --strict: the page builds
      # fine and fails in the browser. Render every diagram to catch it here.
      - name: Check mermaid diagrams render
        run: python3 scripts/check_mermaid.py

      # --strict turns broken internal links into build failures.
      - name: Build
        run: mkdocs build --strict

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
