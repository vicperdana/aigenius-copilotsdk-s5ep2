<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Retail Analytics Assistant (Python)</title>

    <!-- Syntax highlighting - both themes, one is disabled at runtime.
         Every CDN asset carries a Subresource Integrity hash so the browser
         refuses content the CDN did not originally serve. -->
    <link id="hljs-dark" rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
        integrity="sha384-wH75j6z1lH97ZOpMOInqhgKzFkAInZPPSPlZpYKYTOqsaizPvhQZmAtLcPKXpLyH"
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link id="hljs-light" rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css"
        integrity="sha384-eFTL69TLRZTkNfYZOLM+G04821K1qZao/4QLJbet1pP4tcF+fdXq/9CdqAbWRl/L"
        crossorigin="anonymous" referrerpolicy="no-referrer" disabled />

    <link rel="stylesheet" href="app.css" />
</head>

<body>
    <div class="chat-app dark" id="chat-app">
        <header class="header">
            <div class="header-left">
                <h1>📊 Retail Analytics Assistant</h1>
                <span class="badge">Copilot SDK Demo · Python</span>
            </div>
            <div class="header-right">
                <label for="model-select">Model:</label>
                <select id="model-select"></select>
                <button class="btn-clear" id="btn-clear" title="Clear conversation">🗑️ Clear</button>
                <button class="btn-theme" id="btn-theme" title="Toggle theme">🌙</button>
            </div>
        </header>

        <main class="chat-main">
            <div class="messages-container" id="messages-container">
                <div class="welcome" id="welcome">
                    <h2>Retail Analytics Assistant</h2>
                    <p>Ask about customer spending patterns, segment performance, and retail insights.</p>
                    <div class="suggestions" id="suggestions"></div>
                </div>
            </div>

            <div class="chat-input-container">
                <textarea id="chat-input" rows="1"
                    placeholder="Ask about customers, segments, or retail trends..."></textarea>
                <button class="send-btn" id="send-btn" disabled><span>➤</span></button>
            </div>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"
        integrity="sha384-F/bZzf7p3Joyp5psL90p/p89AZJsndkSoGwRpXcZhleCWhd8SnRuoYo4d0yirjJp"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"
        integrity="sha384-FWJTgPmIGm1+zpNhubuHRC/ulS1UK7hAZ7qiUUmKD8yGfPcn5ZXYBd2qRgi6L8Tu"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/csharp.min.js"
        integrity="sha384-wWP4JQEhRVshehTP7lUMDn3yhDI2+398vN2QW5LBt1xIpK0Gfu4dPviO8tP9XRo5"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/json.min.js"
        integrity="sha384-RbRhXcXx5VHUdUaC5R0oV+XBXA5GhkaVCUzK8xN19K3FmtWSHyGVgulK92XnhBsI"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"
        integrity="sha384-OqfnIfpOmAlErKRs2a525ZcwLuZ8Z1x8hPdIwBcMtHkJBbHnpJ6wX5/LVzASHkD5"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"
        integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="app.js"></script>
</body>

</html>
